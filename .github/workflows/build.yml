              private fun cellDiff(a: IntArray, b: IntArray): BooleanArray {
                  val m = BooleanArray(64)
                  for (r in 0..7) for (c in 0..7) {
                      var s = 0
                      for (y in 5..26) for (x in 5..26) {
                          val i = (r * 32 + y) * 256 + c * 32 + x
                          s += abs(lum(a[i]) - lum(b[i]))
                      }
                      m[r * 8 + c] = s / 484 > 6
                  }
                  return m
              }

              // ---------- поиск доски ----------
              private fun cd(a: Int, b: Int): Int =
                  abs(((a shr 16) and 255) - ((b shr 16) and 255)) +
                      abs(((a shr 8) and 255) - ((b shr 8) and 255)) +
                      abs((a and 255) - (b and 255))

              private fun modeColor(l: List<Int>): Int {
                  var b = l[0]
                  var bn = -1
                  for (a in l) {
                      var n = 0
                      for (d in l) if (cd(a, d) < 30) n++
                      if (n > bn) { bn = n; b = a }
                  }
                  return b
              }

              private fun bc(b: Int): Int =
                  (((((b shr 8) and 15) * 16) + 8) shl 16) or (((((b shr 4) and 15) * 16) + 8) shl 8) or (((b and 15) * 16) + 8)

              // замер по углам клеток: шашки круглые и занимают центр, углы почти всегда свободны
              private val OX = floatArrayOf(0.12f, 0.88f, 0.12f, 0.88f)
              private val OY = floatArrayOf(0.12f, 0.12f, 0.88f, 0.88f)

              private fun checker(px: IntArray, w: Int, h: Int, x0: Float, y0: Float, pit: Float, cA: Int, cB: Int): Int {
                  var ok1 = 0
                  var ok2 = 0
                  for (r in 0..7) for (c in 0..7) {
                      var h1 = 0
                      var h2 = 0
                      for (k in 0..3) {
                          val xx = (x0 + (c + OX[k]) * pit).toInt()
                          val yy = (y0 + (r + OY[k]) * pit).toInt()
                          if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue
                          val v = px[yy * w + xx]
                          val isA = cd(v, cA) < 48
                          val isB = cd(v, cB) < 48
                          if ((r + c) % 2 == 0) { if (isA) h1++; if (isB) h2++ } else { if (isB) h1++; if (isA) h2++ }
                      }
                      if (h1 >= 3) ok1++
                      if (h2 >= 3) ok2++
                  }
                  return max(ok1, ok2)
              }

              private fun longestRun(c: IntArray, lo: Int, hi: Int, thr: Int, gap: Int): IntArray? {
                  var bs = -1
                  var be = -1
                  var s = -1
                  var lst = -1
                  for (i in lo until hi) {
                      if (c[i] >= thr) {
                          if (s < 0) s = i
                          lst = i
                      } else if (s >= 0 && i - lst > gap) {
                          if (bs < 0 || lst - s > be - bs) { bs = s; be = lst }
                          s = -1
                      }
                  }
                  if (s >= 0 && (bs < 0 || lst - s > be - bs)) { bs = s; be = lst }
                  return if (bs < 0) null else intArrayOf(bs, be)
              }

              private fun checkerAdapt(px: IntArray, w: Int, h: Int, x0: Float, y0: Float, pit: Float): Int {
                  if (pit < 4f || x0 < 0f || y0 < 0f || x0 + pit * 8f > w + 1f || y0 + pit * 8f > h + 1f) return 0
                  val cr = IntArray(64)
                  val cg = IntArray(64)
                  val cb = IntArray(64)
                  val sr = IntArray(4)
                  val sg = IntArray(4)
                  val sb = IntArray(4)
                  for (r in 0..7) for (c in 0..7) {
                      for (k in 0..3) {
                          val xx = (x0 + (c + OX[k]) * pit).toInt().coerceIn(0, w - 1)
                          val yy = (y0 + (r + OY[k]) * pit).toInt().coerceIn(0, h - 1)
                          val v = px[yy * w + xx]
                          sr[k] = (v shr 16) and 255
                          sg[k] = (v shr 8) and 255
                          sb[k] = v and 255
                      }
                      sr.sort(); sg.sort(); sb.sort()
                      val i = r * 8 + c
                      cr[i] = (sr[1] + sr[2]) / 2
                      cg[i] = (sg[1] + sg[2]) / 2
                      cb[i] = (sb[1] + sb[2]) / 2
                  }
                  val med = IntArray(6)
                  for (par in 0..1) {
                      val lr = IntArray(32)
                      val lg = IntArray(32)
                      val lbb = IntArray(32)
                      var n = 0
                      for (i in 0..63) {
                          if (((i / 8) + (i % 8)) % 2 == par) {
                              lr[n] = cr[i]; lg[n] = cg[i]; lbb[n] = cb[i]
                              n++
                          }
                      }
                      lr.sort(); lg.sort(); lbb.sort()
                      med[par * 3] = lr[16]
                      med[par * 3 + 1] = lg[16]
                      med[par * 3 + 2] = lbb[16]
                  }
                  val cA = (med[0] shl 16) or (med[1] shl 8) or med[2]
                  val cB = (med[3] shl 16) or (med[4] shl 8) or med[5]
                  if (cd(cA, cB) < 36) return 0
                  var ok = 0
                  for (i in 0..63) {
                      val par = ((i / 8) + (i % 8)) % 2
                      val v = (cr[i] shl 16) or (cg[i] shl 8) or cb[i]
                      val own = if (par == 0) cA else cB
                      val oth = if (par == 0) cB else cA
                      val d = cd(v, own)
                      if (d < 54 && d < cd(v, oth)) ok++
                  }
                  return ok
              }

              private fun smoothMax(a: IntArray, lo: Int, hi: Int): IntArray {
                  val o = IntArray(a.size)
                  for (i in lo until hi) {
                      var m = 0
                      for (j in max(lo, i - 2)..min(hi - 1, i + 2)) if (a[j] > m) m = a[j]
                      o[i] = m
                  }
                  return o
              }

              private fun gridCands(prof: IntArray, lo: Int, hi: Int, pMin: Float, pMax: Float, n: Int): List<FloatArray> {
                  val all = ArrayList<FloatArray>()
                  var p = pMin
                  while (p <= pMax) {
                      var bx = -1
                      var bsc = 0
                      var x0 = lo
                      while (x0 + 8f * p <= hi + 3f) {
                          var sc = 0
                          var mn = Int.MAX_VALUE
                          for (k in 1..7) {
                              val i = (x0 + k * p + 0.5f).toInt()
                              val v = if (i >= lo && i < hi) prof[i] else 0
                              sc += v
                              if (v < mn) mn = v
                          }
                          if (mn > 0 && mn * 14 >= sc && sc > bsc) { bsc = sc; bx = x0 }
                          x0++
                      }
                      if (bx >= 0) all.add(floatArrayOf(bx.toFloat(), p, bsc.toFloat()))
                      p += 0.25f
                  }
                  all.sortByDescending { it[2] }
                  val out = ArrayList<FloatArray>()
                  for (c in all) {
                      var dup = false
                      for (o in out) {
                          if (abs(o[0] - c[0]) < 0.4f * c[1] && abs(o[1] - c[1]) < 2f) { dup = true; break }
                      }
                      if (!dup) {
                          out.add(c)
                          if (out.size >= n) break
                      }
                  }
                  return out
              }

              private fun detectBoardEdge(px: IntArray, w: Int, h: Int, roi: IntArray?): IntArray? {
                  val x0r = max(roi?.get(0) ?: 0, 0)
                  val y0r = max(roi?.get(1) ?: 0, 0)
                  val x1r = min(roi?.get(2) ?: w, w)
                  val y1r = min(roi?.get(3) ?: h, h)
                  if (x1r - x0r < 40 || y1r - y0r < 40) return null
                  val colE = IntArray(w)
                  val rowE = IntArray(h)
                  for (y in y0r until y1r - 2) {
                      val o = y * w
                      val o2 = o + 2 * w
                      for (x in x0r until x1r - 2) {
                          val p = px[o + x]
                          if (cd(p, px[o + x + 2]) > 24) colE[x + 1]++
                          if (cd(p, px[o2 + x]) > 24) rowE[y + 1]++
                      }
                  }
                  val cm = smoothMax(colE, x0r, x1r)
                  val rm = smoothMax(rowE, y0r, y1r)
                  val side = min(x1r - x0r, y1r - y0r)
                  val pMin = if (roi == null) max(8f, 0.25f * side / 8f) else 0.55f * side / 8f
                  val pMax = side / 8f + 1f
                  val cc = gridCands(cm, x0r, x1r, pMin, pMax, 8)
                  val rc = gridCands(rm, y0r, y1r, pMin, pMax, 8)
                  var bsc0 = 0
                  var bx0 = 0f
                  var by0 = 0f
                  var bbp = 0f
                  for (c in cc) for (r in rc) {
                      if (abs(c[1] - r[1]) > 2.5f) continue
                      val bp = (c[1] + r[1]) / 2f
                      for (kx in -2..2) for (ky in -2..2) {
                          val sx = c[0] + kx * bp
                          val sy = r[0] + ky * bp
                          val sc = checkerAdapt(px, w, h, sx, sy, bp)
                          if (sc > bsc0 || (sc == bsc0 && sc > 0 && bp > bbp)) {
                              bsc0 = sc; bx0 = sx; by0 = sy; bbp = bp
                          }
                      }
                  }
                  if (bsc0 < 44) return null
                  var best: IntArray? = null
                  var bsc = 0
                  var bpit = 0f
                  for (dp in -4..4) {
                      val pit = bbp + dp * 0.25f
                      for (dx in -2..2) for (dy in -2..2) {
                          val sc = checkerAdapt(px, w, h, bx0 + dx, by0 + dy, pit)
                          if (sc > bsc || (sc == bsc && sc > 0 && pit > bpit)) {
                              bsc = sc
                              bpit = pit
                              best = intArrayOf((bx0 + dx + 0.5f).toInt(), (by0 + dy + 0.5f).toInt(), (pit * 8f + 0.5f).toInt())
                          }
                      }
                  }
                  return if (bsc >= 44) best else null
              }

              private fun detectBoard(px: IntArray, w: Int, h: Int, roi: IntArray? = null): IntArray? {
                  val r = try { detectBoardEdge(px, w, h, roi) } catch (e: Exception) { null }
                  return r ?: try { detectBoardColor(px, w, h, roi) } catch (e: Exception) { null }
              }

              private fun detectBoardColor(px: IntArray, w: Int, h: Int, roi: IntArray? = null): IntArray? {
                  val x0r = max(roi?.get(0) ?: 0, 0)
                  val y0r = max(roi?.get(1) ?: 0, 0)
                  val x1r = min(roi?.get(2) ?: w, w)
                  val y1r = min(roi?.get(3) ?: h, h)
                  if (x1r - x0r < 40 || y1r - y0r < 40) return null
                  val bins = IntArray(w * h)
                  val cnt = IntArray(4096)
                  for (y in y0r until y1r) {
                      val o = y * w
                      for (x in x0r until x1r) {
                          val p = px[o + x]
                          val b = (((p shr 20) and 15) shl 8) or (((p shr 12) and 15) shl 4) or ((p shr 4) and 15)
                          bins[o + x] = b
                          cnt[b]++
                      }
                  }
                  val area = (x1r - x0r) * (y1r - y0r)
                  val top = (0 until 4096).sortedByDescending { cnt[it] }.take(8).filter { cnt[it] > area / 80 }
                  if (top.size < 2) return null
                  val cols = top.map { bc(it) }
                  val mt = Array(top.size) { k -> BooleanArray(4096) { b -> cd(bc(b), cols[k]) < 40 } }
                  val minS = if (roi == null) (0.3f * w).toInt() else 40
                  var best: IntArray? = null
                  var bestSc = 0
                  for (i in top.indices) for (j in i + 1 until top.size) {
                      if (cd(cols[i], cols[j]) < 40) continue
                      val ma = mt[i]
                      val mb = mt[j]
                      val rowC = IntArray(h)
                      val colC = IntArray(w)
                      var y = y0r
                      while (y < y1r) {
                          val o = y * w
                          var rc = 0
                          for (x in x0r until x1r) {
                              val b = bins[o + x]
                              if (ma[b] || mb[b]) { rc++; colC[x]++ }
                          }
                          rowC[y] = rc
                          if (y + 1 < y1r) rowC[y + 1] = rc
                          y += 2
                      }
                      var mxR = 0
                      for (yy in y0r until y1r) mxR = max(mxR, rowC[yy])
                      var mxC = 0
                      for (xx in x0r until x1r) mxC = max(mxC, colC[xx])
                      if (mxR < 40 || mxC < 20) continue
                      val rr = longestRun(rowC, y0r, y1r, (mxR * 0.4f).toInt(), 6) ?: continue
                      val cc = longestRun(colC, x0r, x1r, (mxC * 0.4f).toInt(), 6) ?: continue
                      val bw = cc[1] - cc[0] + 1
                      val bh = rr[1] - rr[0] + 1
                      val side = if (abs(bw - bh) <= 0.06f * max(bw, bh)) (bw + bh) / 2 else min(bw, bh)
                      if (side < minS) continue
                      val xl = ArrayList<Int>()
                      val yl = ArrayList<Int>()
                      if (bw - side <= 3) xl.add(cc[0] + (bw - side) / 2) else {
                          var x = cc[0]
                          val stp = max(2, side / 60)
                          while (x <= cc[1] - side + 1) { xl.add(x); x += stp }
                      }
                      if (bh - side <= 3) yl.add(rr[0] + (bh - side) / 2) else {
                          var yy = rr[0]
                          val stp = max(2, side / 60)
                          while (yy <= rr[1] - side + 1) { yl.add(yy); yy += stp }
                      }
                      var bx = 0
                      var by2 = 0
                      var bsd = side
                      var bsc = -1
                      for (xx in xl) for (yy in yl) {
                          val sc = checker(px, w, h, xx.toFloat(), yy.toFloat(), side / 8f, cols[i], cols[j])
                          if (sc > bsc) { bsc = sc; bx = xx; by2 = yy }
                      }
                      val cx = bx
                      val cy = by2
                      val cs = bsd
                      for (ds in -2..2) for (dx in -2..2) for (dy in -2..2) {
                          val sd = cs + ds
                          if (sd < minS) continue
                          val sc = checker(px, w, h, (cx + dx).toFloat(), (cy + dy).toFloat(), sd / 8f, cols[i], cols[j])
                          if (sc > bsc) { bsc = sc; bx = cx + dx; by2 = cy + dy; bsd = sd }
                      }
                      if (bsc >= 44 && bsc > bestSc && bx >= 0 && by2 >= 0) {
                          bestSc = bsc
                          best = intArrayOf(bx, by2, bsd)
                      }
                  }
                  return best
              }

              private fun snapRegion(x: Int, y: Int, s: Int) {
                  var nx = x
                  var ny = y
                  var ns = s
                  try {
                      freshFrame()
                      val px = fullShot()
                      showAll()
                      if (px != null) {
                          val m = (s * 0.12f).toInt()
                          val r = detectBoard(px, fw, fh, intArrayOf((x - m) / SC, (y - m) / SC, (x + s + m) / SC, (y + s + m) / SC))
                          if (r != null) { nx = r[0] * SC; ny = r[1] * SC; ns = r[2] * SC }
                      }
                  } catch (ex: Exception) { }
                  rx = nx; ry = ny; rs = ns
                  H.post {
                      ov?.let {
                          lp.flags = lp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          wm.updateViewLayout(it, lp)
                      }
                  }
                  setBoard()
                  regionReady = true
              }
                            // ---------- чтение клеток ----------
              // фон клетки берём по углам (шашка круглая и углы не закрывает), шашку ищем в круге в центре
              private fun cellsInfo(f: IntArray): Array<Cell> {
                  val sxs = intArrayOf(1, 28, 1, 28)
                  val sys = intArrayOf(1, 1, 28, 28)
                  return Array(64) { idx ->
                      val r = idx / 8
                      val c = idx % 8
                      val ra = IntArray(36)
                      val ga = IntArray(36)
                      val ba = IntArray(36)
                      var k = 0
                      for (q in 0..3) for (dy in 0..2) for (dx in 0..2) {
                          val p = f[(r * 32 + sys[q] + dy) * 256 + c * 32 + sxs[q] + dx]
                          ra[k] = (p shr 16) and 255; ga[k] = (p shr 8) and 255; ba[k] = p and 255
                          k++
                      }
                      ra.sort(); ga.sort(); ba.sort()
                      val mr = ra[18]
                      val mg = ga[18]
                      val mb = ba[18]
                      var cnt = 0
                      var minx = 99
                      var maxx = -1
                      var miny = 99
                      var maxy = -1
                      val lums = IntArray(400)
                      var nl = 0
                      for (y in 4..27) for (x in 4..27) {
                          val ddx = x - 15.5f
                          val ddy = y - 15.5f
                          val rr = ddx * ddx + ddy * ddy
                          if (rr > 121f) continue
                          val p = f[(r * 32 + y) * 256 + c * 32 + x]
                          val d = abs(((p shr 16) and 255) - mr) + abs(((p shr 8) and 255) - mg) + abs((p and 255) - mb)
                          if (d > 40) {
                              cnt++
                              if (x < minx) minx = x
                              if (x > maxx) maxx = x
                              if (y < miny) miny = y
                              if (y > maxy) maxy = y
                              if (rr <= 81f && nl < 400) { lums[nl++] = lum(p) }
                          }
                      }
                      val occ = cnt > 110 && maxy - miny >= 12 && maxx - minx >= 12
                      var lm = 0
                      if (nl > 0) { val a = lums.copyOf(nl); a.sort(); lm = a[nl / 2] }
                      // узор внутри шашки (корона дамки): яркость относительно медианы, 10x10, только внутри круга
                      val vec = FloatArray(100)
                      if (occ) {
                          for (gy in 0..9) for (gx in 0..9) {
                              val cx = 6 + gx * 2 + 1 - 15.5f
                              val cy = 6 + gy * 2 + 1 - 15.5f
                              if (cx * cx + cy * cy > 100f) continue
                              var s = 0
                              for (dy in 0..1) for (dx in 0..1) s += lum(f[(r * 32 + 6 + gy * 2 + dy) * 256 + c * 32 + 6 + gx * 2 + dx])
                              vec[gy * 10 + gx] = abs(s / 4 - lm).toFloat()
                          }
                      }
                      Cell(occ, lm, vec, (mr shl 16) or (mg shl 8) or mb)
                  }
              }

              // порог яркости «светлые / тёмные шашки»
              private fun lumThr(cells: Array<Cell>): Int {
                  val l = ArrayList<Int>()
                  for (c in cells) if (c.occ) l.add(c.lum)
                  if (l.size >= 2) {
                      var a = l.minOrNull() ?: 0
                      var b = l.maxOrNull() ?: 255
                      repeat(8) {
                          val m = (a + b) / 2
                          var sa = 0
                          var na = 0
                          var sb = 0
                          var nb = 0
                          for (v in l) { if (v <= m) { sa += v; na++ } else { sb += v; nb++ } }
                          if (na > 0) a = sa / na
                          if (nb > 0) b = sb / nb
                      }
                      if (b - a >= 35) return (a + b) / 2
                  }
                  return if (haveLum) (lumW + lumB) / 2 else 128
              }

              // какие клетки игровые: обычно (r+c) нечётные; если шашки стоят на чётных, доска зеркальная
              private fun updMirror(cells: Array<Cell>) {
                  var a = 0
                  var b = 0
                  for (i in 0..63) if (cells[i].occ) { if ((i / 8 + i % 8) % 2 == 1) a++ else b++ }
                  if (a + b >= 4) {
                      mir = b > a
                  }
              }

              private fun wrongCells(cells: Array<Cell>): Int {
                  var n = 0
                  for (i in 0..63) if (cells[i].occ && sqOf(i / 8, i % 8) < 0) n++
                  return n
              }

              // цвета на полях: 0 пусто, 1 светлая, 2 тёмная
              private fun colors(cells: Array<Cell>, thr: Int): IntArray {
                  val g = IntArray(32)
                  for (i in 0..31) {
                      val cell = cells[cellOf(i)]
                      if (cell.occ) g[i] = if (cell.lum > thr) 1 else 2
                  }
                  return g
              }

              private fun posColors(p: Pos): IntArray = IntArray(32) { val s = sideOf(p.b[it]); if (s < 0) 0 else s + 1 }

              private fun mism(a: IntArray, b: IntArray): Int {
                  var d = 0
                  for (i in a.indices) if (a[i] != b[i]) d++
                  return d
              }

              // ---------- шаблоны: шашка или дамка ----------
              private fun vdist(t: FloatArray, v: FloatArray): Float {
                  var best = 1e9f
                  for (dy in -1..1) for (dx in -1..1) {
                      var d = 0f
                      for (y in 0..9) {
                          val yy = y + dy
                          for (x in 0..9) {
                              val xx = x + dx
                              val b = if (yy in 0..9 && xx in 0..9) v[yy * 10 + xx] else 0f
                              d += abs(t[y * 10 + x] - b)
                          }
                      }
                      if (d < best) best = d
                  }
                  return best
              }

              private fun medianVec(l: List<FloatArray>): FloatArray {
                  val o = FloatArray(100)
                  val tmp = FloatArray(l.size)
                  for (k in 0..99) {
                      for (j in l.indices) tmp[j] = l[j][k]
                      tmp.sort()
                      o[k] = tmp[l.size / 2]
                  }
                  return o
              }

              private fun kingGuess(cells: Array<Cell>, col: IntArray): BooleanArray {
                  val res = BooleanArray(32)
                  for (c in 0..1) {
                      val sqs = (0..31).filter { col[it] == c + 1 }
                      if (sqs.isEmpty()) continue
                      val tm = tpl[c * 2]
                      val tk = tpl[c * 2 + 1]
                      if (tm != null) {
                          val thr = max(3f * dMan[c], dMan[c] + 150f)
                          for (i in sqs) {
                              val v = cells[cellOf(i)].vec
                              val dm = vdist(tm, v)
                              res[i] = if (tk != null) vdist(tk, v) < dm else dm > thr
                          }
                      } else if (sqs.size >= 3) {
                          val vs = sqs.map { cells[cellOf(it)].vec }
                          val med = medianVec(vs)
                          val ds = vs.map { vdist(med, it) }
                          val md = ds.sorted()[ds.size / 2]
                          for (k in sqs.indices) res[sqs[k]] = ds[k] > max(3f * md, md + 250f)
                      }
                      // шашка на последней горизонтали всегда дамка
                      for (i in sqs) if (Geo.rank(i) == (if (c == 0) 7 else 0)) res[i] = true
                  }
                  return res
              }

              // учим вид фигур по известной позиции (цвета на экране должны совпадать)
              private fun learn(cells: Array<Cell>, p: Pos, force: Boolean) {
                  val acc = Array(4) { FloatArray(100) }
                  val n = IntArray(4)
                  var sw = 0; var nw = 0; var sb = 0; var nb = 0
                  for (i in 0..31) {
                      val pc = p.b[i]
                      if (pc == 0) continue
                      val cell = cells[cellOf(i)]
                      if (!cell.occ) continue
                      val t = pc - 1
                      n[t]++
                      for (k in 0..99) acc[t][k] += cell.vec[k]
                      if (t < 2) { sw += cell.lum; nw++ } else { sb += cell.lum; nb++ }
                  }
                  var newKing = false
                  for (t in 0..3) {
                      if (n[t] == 0) continue
                      val avg = FloatArray(100) { acc[t][it] / n[t] }
                      val old = tpl[t]
                      if (old == null) { if (t % 2 == 1) newKing = true; tpl[t] = avg }
                      else if (force) tpl[t] = avg
                      else for (k in 0..99) old[k] = old[k] * 0.7f + avg[k] * 0.3f
                  }
                  for (c in 0..1) {
                      val tm = tpl[c * 2] ?: continue
                      var s = 0f; var k = 0
                      for (i in 0..31) if (p.b[i] == c * 2 + 1 && cells[cellOf(i)].occ) { s += vdist(tm, cells[cellOf(i)].vec); k++ }
                      if (k > 0) dMan[c] = if (force) s / k else dMan[c] * 0.7f + (s / k) * 0.3f
                  }
                  if (nw > 0 && nb > 0) { lumW = sw / nw; lumB = sb / nb; haveLum = true }
                  learnN++
                  if (force || newKing || learnN % 10 == 0) save()
              }

              private fun save() {
                  val sb = StringBuilder("$lumW,$lumB,${dMan[0]},${dMan[1]}")
                  for (t in tpl) {
                      sb.append(';')
                      if (t == null) sb.append('-') else sb.append(t.joinToString(",") { (it * 10).toInt().toString() })
                  }
                  getSharedPreferences("t", Context.MODE_PRIVATE).edit().putString("ck1", sb.toString()).apply()
              }

              private fun load() {
                  val s = getSharedPreferences("t", Context.MODE_PRIVATE).getString("ck1", null) ?: return
                  try {
                      val parts = s.split(";")
                      val l = parts[0].split(",")
                      lumW = l[0].toInt(); lumB = l[1].toInt()
                      dMan[0] = l[2].toFloat(); dMan[1] = l[3].toFloat()
                      for (t in 0..3) {
                          val q = parts[t + 1]
                          tpl[t] = if (q == "-") null else q.split(",").map { it.toInt() / 10f }.toFloatArray().also { if (it.size != 100) throw RuntimeException() }
                      }
                      haveLum = true
                  } catch (e: Exception) { for (t in 0..3) tpl[t] = null; haveLum = false }
              }

              // ---------- определение позиции ----------
              // кто ходил последним по подсветке клеток: 0 светлые, 1 тёмные, -1 неизвестно
              private fun lastMover(cells: Array<Cell>, thr: Int): Int {
                  val play = (0..63).filter { sqOf(it / 8, it % 8) >= 0 }
                  val m = modeColor(play.map { cells[it].bg })
                  var res = -1
                  var cnt = 0
                  var mix = false
                  for (i in play) {
                      if (cd(cells[i].bg, m) > 50) {
                          cnt++
                          if (cells[i].occ) {
                              val c = if (cells[i].lum > thr) 0 else 1
                              if (res == -1) res = c else if (res != c) mix = true
                          }
                      }
                  }
                  return if (cnt in 1..12 && !mix) res else -1
              }

              private fun resetSync() { unmatchedSince = 0L; needSync = false }

              private fun newPos(): Pos { russian = getSharedPreferences("s", Context.MODE_PRIVATE).getInt("rules", 0) == 0; return Pos(russian) }

              // начальная расстановка (допуск 1 клетка): по занятости, сторону определяем по яркости
              private fun tryStart(cells: Array<Cell>, thr: Int): Boolean {
                  updMirror(cells)
                  var bottomL = 0; var bn = 0; var topL = 0; var tn = 0
                  for (i in 0..63) {
                      if (!cells[i].occ) continue
                      if (i / 8 >= 4) { bottomL += cells[i].lum; bn++ } else { topL += cells[i].lum; tn++ }
                  }
                  if (bn == 0 || tn == 0) return false
                  val nlb = bottomL / bn >= topL / tn
                  val olb = lb
                  lb = nlb
                  val st = newPos()
                  st.setStart()
                  val sc = posColors(st)
                  var d = 0
                  for (i in 0..31) if ((sc[i] != 0) != cells[cellOf(i)].occ) d++
                  if (d > 1 || wrongCells(cells) > 1) { lb = olb; return false }
                  pos = st
                  orientKnown = true
                  learn(cells, st, true)
                  search.clear()
                  resetSync()
                  return true
              }

              // позиция целиком по экрану (партия в середине)
              private fun tryScratch(cells: Array<Cell>, thr: Int): Boolean {
                  updMirror(cells)
                  if (wrongCells(cells) > 1) return false
                  // ориентация: светлые шашки в среднем ниже тёмных
                  var sl = 0; var nl = 0; var sd = 0; var nd = 0
                  for (i in 0..63) {
                      if (!cells[i].occ) continue
                      if (cells[i].lum > thr) { sl += i / 8; nl++ } else { sd += i / 8; nd++ }
                  }
                  if (nl > 0 && nd > 0) {
                      val diff = sl.toFloat() / nl - sd.toFloat() / nd
                      if (!orientKnown || abs(diff) >= 1.5f) lb = diff >= 0
                  }
                  val col = colors(cells, thr)
                  var cl = 0; var cdk = 0
                  for (v in col) { if (v == 1) cl++; if (v == 2) cdk++ }
                  if (cl > 12 || cdk > 12 || cl + cdk == 0) return false
                  val kg = kingGuess(cells, col)
                  val pcs = IntArray(32) { if (col[it] == 0) 0 else (col[it] - 1) * 2 + 1 + (if (kg[it]) 1 else 0) }
                  val lm = lastMover(cells, thr)
                  val me = if (lb) 0 else 1
                  val side = if (lm >= 0) 1 - lm else me
                  val np = newPos()
                  np.load(pcs, side)
                  pos = np
                  orientKnown = true
                  search.clear()
                  resetSync()
                  return true
              }

              private fun establish(cells: Array<Cell>, thr: Int): Boolean = tryStart(cells, thr) || tryScratch(cells, thr)

              // ход (или два полухода), после которого цвета на полях совпадают с экраном
              private fun findMove(p: Pos, col: IntArray, kg: BooleanArray): Move? {
                  var best: Move? = null
                  var bk = 99
                  for (m in p.moves()) {
                      p.make(m)
                      if (mism(posColors(p), col) == 0) {
                          var k = 0
                          for (i in 0..31) if (p.b[i] != 0 && isKing(p.b[i]) != kg[i]) k++
                          if (k < bk) { bk = k; best = m }
                      }
                      p.unmake(m)
                  }
                  return best
              }

              private fun findMove2(p: Pos, col: IntArray): Boolean {
                  for (m1 in p.moves()) {
                      p.make(m1)
                      for (m2 in p.moves()) {
                          p.make(m2)
                          if (mism(posColors(p), col) == 0) return true
                          p.unmake(m2)
                      }
                      p.unmake(m1)
                  }
                  return false
              }

              private fun noticeMsg(): String = "Не понял позицию, жду…"

              // 1 = позиция обновилась, 0 = без изменений / не понял
              private fun process(f: IntArray): Int {
                  val cells = cellsInfo(f)
                  val thr = lumThr(cells)
                  updMirror(cells)
                  val col = colors(cells, thr)
                  var n = 0
                  for (v in col) if (v != 0) n++
                  val wrong = wrongCells(cells)
                  badGrid = n > 24 || n < 1 || wrong > 2
                  if (badGrid) { dbg = "шашек $n, лишних клеток $wrong"; needSync = true; return 0 }
                  val pc = posColors(pos)
                  if (mism(pc, col) == 0) { unmatchedSince = 0L; needSync = false; learn(cells, pos, false); return 0 }
                  dbg = "расхождение с партией: ${mism(pc, col)} кл."
                  val kg = kingGuess(cells, col)
                  val mv = findMove(pos, col, kg)
                  if (mv != null) { pos.make(mv); learn(cells, pos, false); resetSync(); return 1 }
                  val p2 = pos.copy()
                  if (findMove2(p2, col)) { pos = p2; learn(cells, pos, false); resetSync(); return 1 }
                  val fl = pos.copy()
                  fl.side = fl.side xor 1
                  fl.rehash()
                  val m3 = findMove(fl, col, kg)
                  if (m3 != null) { fl.make(m3); pos = fl; resetSync(); return 1 }
                  if (tryStart(cells, thr)) return 1
                  val now = System.currentTimeMillis()
                  if (unmatchedSince == 0L) unmatchedSince = now
                  needSync = true
                  if (now - unmatchedSince > 900) {
                      if (tryScratch(cells, thr)) return 1
                  }
                  return 0
              }

              private fun fmtScore(): String {
                  val s = if (pos.side == 0) search.score else -search.score
                  if (search.isWin(s)) {
                      val who = if (s > 0) "светлых" else "тёмных"
                      return "выигрыш $who через ${(search.pliesToWin(s) + 1) / 2} ход."
                  }
                  return String.format("%+.2f", s / 100.0) + " (за светлых)"
              }

              // 0 = подсказки нет, 1 = показана, 2 = позиция уже изменилась
              private fun suggest(base: IntArray): Int {
                  if (pos.moves().isEmpty()) { show("Ходов нет. Партия окончена", null); return 0 }
                  val sp = getSharedPreferences("s", Context.MODE_PRIVATE)
                  val both = sp.getBoolean("both", false)
                  val me = if (lb) 0 else 1
                  if (!both && pos.side != me) { show("Жду ход соперника…", null); return 0 }
                  show("Думаю…", null)
                  val ms = sp.getInt("ms", 5000).coerceIn(1000, 5000)
                  val m = search.best(pos, ms) ?: run { show("Нет хода", null); return 0 }
                  val chk = clean()
                  if (chk != null && cellDiff(base, chk).any { it }) return 2
                  val name = if (isKing(m.piece)) "Дамка" else "Шашка"
                  var text = if (m.capSq.isNotEmpty())
                      name + " бьёт " + Geo.name(m.from) + m.path.joinToString("") { ":" + Geo.name(it) } +
                          (if (m.capSq.size > 1) " (×${m.capSq.size})" else "")
                  else name + " " + Geo.name(m.from) + " → " + Geo.name(m.to)
                  if (m.promo) text += ", в дамки"
                  val dep = if (search.depth > 0) " · глубина " + search.depth else ""
                  show(text, m, "Оценка: " + fmtScore() + dep)
                  return 1
              }

              // ---------- главный цикл ----------
              private fun findBoard(forceManual: Boolean): Boolean {
                  regionReady = false
                  show("Ищу доску…", null)
                  val t0 = System.currentTimeMillis()
                  var manual = false
                  if (forceManual) { manual = true; H.post { enableManual() } }
                  while (running && !regionReady) {
                      if (!manual) {
                          freshFrame()
                          val px = fullShot()
                          showAll()
                          if (px != null) {
                              val r = detectBoard(px, fw, fh)
                              if (r != null) {
                                  rx = r[0] * SC; ry = r[1] * SC; rs = r[2] * SC
                                  setBoard()
                                  regionReady = true
                                  break
                              }
                          }
                          if (System.currentTimeMillis() - t0 > 5000) {
                              manual = true
                              H.post { enableManual() }
                          }
                      }
                      Thread.sleep(250)
                  }
                  return running
              }

              // true = нужно заново искать доску
              private fun session(): Boolean {
                  show("Доска найдена. Читаю позицию…", null)
                  Thread.sleep(150)
                  resetSync()
                  var badSince = 0L
                  var cf: IntArray? = null
                  val baseX = rx
                  val baseY = ry
                  var failSince = System.currentTimeMillis()
                  var shiftIdx = -1
                  while (running && !recalReq) {
                      val f = clean()
                      if (f == null) { Thread.sleep(200); continue }
                      val cells = cellsInfo(f)
                      val thr = lumThr(cells)
                      var n = 0
                      for (c in cells) if (c.occ) n++
                      val now = System.currentTimeMillis()
                      if (n > 24 || n < 1) {
                          if (badSince == 0L) badSince = now
                          if (now - badSince > 2500) return true
                          show("Проверяю границы доски…", null, "шашек: $n")
                          Thread.sleep(300)
                          continue
                      }
                      badSince = 0L
                      if (establish(cells, thr)) { cf = f; break }
                      dbg = "шашек: $n, на светлых полях: ${wrongCells(cells)}"
                      if (shiftIdx >= 0) dbg += " · сдвиг " + (shiftIdx + 1)
                      if (now - failSince > 1800) {
                          failSince = now
                          shiftIdx++
                          rx = baseX
                          ry = baseY
                          if (shiftIdx >= SHIFTS.size) { setBoard(); return true }
                          val st = rs / 8
                          val nx = baseX + SHIFTS[shiftIdx][0] * st
                          val ny = baseY + SHIFTS[shiftIdx][1] * st
                          if (nx >= 0 && ny >= 0 && nx + rs <= fw * SC && ny + rs <= fh * SC) { rx = nx; ry = ny }
                          setBoard()
                      }
                      show(noticeMsg(), null, dbg)
                      Thread.sleep(400)
                  }
                  if (!running) return false
                  if (recalReq || cf == null) return true
                  var st = try { suggest(cf) } catch (ex: Exception) { needSync = true; -1 }
                  waitFrame()
                  var ref: IntArray? = if (st == 2) cf else grab()
                  var seen = seq
                  var unstable = false
                  var lastIdle = System.currentTimeMillis()
                  badSince = 0L
                  while (running && !recalReq) {
                      val now = System.currentTimeMillis()
                      val forced = (needSync && now - lastSyncTry > 700) || (unstable && now - lastIdle > 400)
                      if (!forced && seq == seen) { Thread.sleep(30); continue }
                      seen = seq
                      lastSyncTry = now
                      val a = grab() ?: continue
                      Thread.sleep(90)
                      val b = grab() ?: continue
                      if (cellDiff(a, b).any { it }) { unstable = true; lastIdle = System.currentTimeMillis(); continue }
                      unstable = false
                      if (!forced) {
                          val r0 = ref ?: b
                          if (!cellDiff(r0, b).any { it }) continue
                      }
                      val wasSync = needSync
                      val f = (if (needSync) grab() else clean(false)) ?: continue
                      val res = try { process(f) } catch (ex: Exception) { needSync = true; 0 }
                      if (badGrid) {
                          if (badSince == 0L) badSince = now else if (now - badSince > 2500) return true
                      } else badSince = 0L
                      if (res == 1 || (wasSync && !needSync)) {
                          st = try { suggest(f) } catch (ex: Exception) { needSync = true; unmatchedSince = 0L; -1 }
                      } else {
                          if (needSync) show(noticeMsg(), null, dbg) else reShow()
                          st = -1
                      }
                      waitFrame()
                      ref = if (st == 2) f else grab()
                      seen = seq
                  }
                  return recalReq
              }

              private fun loop() {
                  try {
                      load()
                      pos = newPos()
                      pos.setStart()
                      var manual = false
                      while (running) {
                          if (!findBoard(manual)) return
                          session()
                          if (!running) return
                          manual = recalReq
                          recalReq = false
                      }
                  } catch (ex: Exception) {
                      show("Ошибка: " + ex.message, null)
                  }
              }

              override fun onDestroy() {
                  running = false
                  ov?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  proj?.stop()
                  synchronized(lock) { try { held?.close() } catch (e: Exception) {}; held = null }
                  imgThread?.quitSafely()
                  try { reader?.close() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk checkers-helper.apk
          gh release create "v${{ github.run_number }}" checkers-helper.apk --title "APK ${{ github.run_number }}" --notes "Шашечный помощник" --target "${{ github.sha }}"
