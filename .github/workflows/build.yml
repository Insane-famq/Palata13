name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/helper/checkers
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CheckersHelper"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx3g" > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.helper.checkers"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.helper.checkers"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  getByName("debug") { isDebuggable = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Шашечный помощник"
                  android:allowBackup="false"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/helper/checkers/MainActivity.kt <<'EOF'
          package com.helper.checkers

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              private fun btn(text: String, color: Int): Button {
                  val b = Button(this)
                  b.text = text
                  b.setTextColor(Color.WHITE)
                  b.textSize = 17f
                  b.isAllCaps = false
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = 48f
                  b.background = g
                  val lp = LinearLayout.LayoutParams(-1, 150)
                  lp.topMargin = 28
                  b.layoutParams = lp
                  return b
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val prefs = getSharedPreferences("s", Context.MODE_PRIVATE)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 2)
                  }
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(56, 110, 56, 56)

                  val title = TextView(this)
                  title.text = "⛀ Шашечный помощник"
                  title.textSize = 28f
                  title.setTextColor(Color.WHITE)
                  title.gravity = Gravity.CENTER
                  root.addView(title)

                  val sub = TextView(this)
                  sub.text = "Свой движок в реальном времени: стрелка хода и оценка прямо поверх доски"
                  sub.textSize = 14f
                  sub.setTextColor(0xFF8B98A5.toInt())
                  sub.gravity = Gravity.CENTER
                  sub.setPadding(0, 12, 0, 40)
                  root.addView(sub)

                  val steps = TextView(this)
                  steps.text = "1. Открой приложение с шашками (можно с любого момента партии)\n" +
                      "2. Вернись сюда, выбери правила и нажми «Запустить»\n" +
                      "3. Дай доступ, доска и позиция определятся сами\n" +
                      "4. Если доску не нашёл, обведи её по краям, рамка сама подстроится\n" +
                      "5. Вид шашек и дамок запоминается сам (лучше начать с новой партии)"
                  steps.textSize = 15f
                  steps.setTextColor(0xFFD0D7DE.toInt())
                  steps.setLineSpacing(8f, 1f)
                  val card = GradientDrawable()
                  card.setColor(0xFF1A2129.toInt())
                  card.cornerRadius = 36f
                  steps.background = card
                  steps.setPadding(40, 36, 40, 36)
                  root.addView(steps)

                  val rl = TextView(this)
                  rl.text = "Правила:"
                  rl.textSize = 16f
                  rl.setTextColor(Color.WHITE)
                  rl.setPadding(0, 40, 0, 4)
                  root.addView(rl)
                  val rg = RadioGroup(this)
                  val r0 = RadioButton(this)
                  r0.text = "Русские шашки (дамка дальнобойная, бьют назад)"
                  r0.setTextColor(Color.WHITE)
                  r0.id = 1001
                  val r1 = RadioButton(this)
                  r1.text = "Английские / американские (checkers)"
                  r1.setTextColor(Color.WHITE)
                  r1.id = 1002
                  rg.addView(r0); rg.addView(r1)
                  rg.check(if (prefs.getInt("rules", 0) == 0) 1001 else 1002)
                  rg.setOnCheckedChangeListener { _, id -> prefs.edit().putInt("rules", if (id == 1001) 0 else 1).apply() }
                  root.addView(rg)

                  val tl = TextView(this)
                  tl.textSize = 16f
                  tl.setTextColor(Color.WHITE)
                  tl.setPadding(0, 32, 0, 8)
                  root.addView(tl)
                  val sb = SeekBar(this)
                  sb.max = 4
                  val cur = prefs.getInt("ms", 5000)
                  sb.progress = (cur / 1000 - 1).coerceIn(0, 4)
                  fun upd(sec: Int) { tl.text = "Макс. время на ход: $sec с\n(если ход очевиден, ответит быстрее)" }
                  upd(sb.progress + 1)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(x: SeekBar?, p: Int, u: Boolean) {
                          upd(p + 1)
                          prefs.edit().putInt("ms", (p + 1) * 1000).apply()
                      }
                      override fun onStartTrackingTouch(x: SeekBar?) {}
                      override fun onStopTrackingTouch(x: SeekBar?) {}
                  })
                  root.addView(sb)

                  val both = CheckBox(this)
                  both.text = "Подсказывать за обе стороны (разбор партии)"
                  both.setTextColor(Color.WHITE)
                  both.textSize = 15f
                  both.setPadding(0, 24, 0, 0)
                  both.isChecked = prefs.getBoolean("both", false)
                  both.setOnCheckedChangeListener { _, v -> prefs.edit().putBoolean("both", v).apply() }
                  root.addView(both)

                  val go = btn("▶  Запустить", 0xFF2E9E5B.toInt())
                  val stop = btn("■  Остановить", 0xFFB23B3B.toInt())
                  val recal = btn("Указать доску вручную", 0xFF2A3440.toInt())
                  val reset = btn("Забыть вид шашек (сброс)", 0xFF2A3440.toInt())
                  root.addView(go); root.addView(stop); root.addView(recal); root.addView(reset)

                  val sv = ScrollView(this)
                  sv.isFillViewport = true
                  sv.setBackgroundColor(0xFF0F1419.toInt())
                  sv.addView(root)
                  sv.setOnApplyWindowInsetsListener { _, ins ->
                      root.setPadding(56, ins.systemWindowInsetTop + 48, 56, ins.systemWindowInsetBottom + 48)
                      ins
                  }
                  setContentView(sv)

                  go.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          Toast.makeText(this, "Разреши «Поверх других приложений» и нажми снова", Toast.LENGTH_LONG).show()
                      } else {
                          val m = getSystemService(MediaProjectionManager::class.java)
                          startActivityForResult(m.createScreenCaptureIntent(), 1)
                      }
                  }
                  stop.setOnClickListener { stopService(Intent(this, CaptureService::class.java)) }
                  recal.setOnClickListener {
                      startService(Intent(this, CaptureService::class.java).setAction("recal"))
                      Toast.makeText(this, "Вернись в игру и обведи доску по краям", Toast.LENGTH_SHORT).show()
                      moveTaskToBack(true)
                  }
                  reset.setOnClickListener {
                      getSharedPreferences("t", Context.MODE_PRIVATE).edit().clear().apply()
                      Toast.makeText(this, "Готово. Вид шашек запомнится заново", Toast.LENGTH_SHORT).show()
                  }
              }

              @Deprecated("old api")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (res == RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java)
                          .putExtra("code", res).putExtra("data", data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/helper/checkers/Engine.kt <<'EOF'
          package com.helper.checkers

          // Поле: 32 тёмные клетки. idx = rank*4 + file/2, rank 0 — сторона светлых.
          // Фигуры: 0 пусто, 1 светлая шашка, 2 светлая дамка, 3 тёмная шашка, 4 тёмная дамка.
          // Сторона: 0 светлые, 1 тёмные.

          object Geo {
              val NB = IntArray(128) { -1 }
              private val DF = intArrayOf(1, -1, 1, -1)
              private val DR = intArrayOf(1, 1, -1, -1)
              fun file(i: Int) = 2 * (i % 4) + ((i / 4) % 2)
              fun rank(i: Int) = i / 4
              fun sq(f: Int, r: Int): Int = if (f !in 0..7 || r !in 0..7 || (f + r) % 2 != 0) -1 else r * 4 + f / 2
              fun name(i: Int) = "" + ('a' + file(i)) + (rank(i) + 1)
              init {
                  for (i in 0..31) for (d in 0..3) NB[i * 4 + d] = sq(file(i) + DF[d], rank(i) + DR[d])
              }
          }

          fun sideOf(p: Int) = if (p == 1 || p == 2) 0 else if (p == 3 || p == 4) 1 else -1
          fun isKing(p: Int) = p == 2 || p == 4

          class Move(
              val from: Int, val to: Int, val path: IntArray,
              val capSq: IntArray, val capPc: IntArray, val piece: Int, val promo: Boolean
          ) {
              val capMask: Int get() { var m = 0; for (s in capSq) m = m or (1 shl s); return m }
              fun key(): Long = from.toLong() or (to.toLong() shl 5) or ((capMask.toLong() and 0xFFFFFFFFL) shl 10)
          }

          // russian = true: шашки бьют назад, дамки дальнобойные, превращение посреди боя с продолжением.
          // russian = false (английские/американские): бьют только вперёд, дамка ходит на 1, превращение завершает ход.
          class Pos(val russian: Boolean) {
              val b = IntArray(32)
              var side = 0
              var hash = 0L

              companion object {
                  private val Z = Array(32) { LongArray(5) }
                  private var ZS = 0L
                  init {
                      val r = java.util.Random(20261120)
                      for (i in 0..31) for (p in 1..4) Z[i][p] = r.nextLong()
                      ZS = r.nextLong()
                  }
              }

              fun firstSide() = if (russian) 0 else 1

              fun setStart() {
                  for (i in 0..31) b[i] = if (i < 12) 1 else if (i >= 20) 3 else 0
                  side = firstSide()
                  rehash()
              }

              fun load(pcs: IntArray, s: Int) { for (i in 0..31) b[i] = pcs[i]; side = s; rehash() }

              fun rehash() {
                  var h = 0L
                  for (i in 0..31) if (b[i] != 0) h = h xor Z[i][b[i]]
                  if (side == 1) h = h xor ZS
                  hash = h
              }

              fun copy(): Pos { val p = Pos(russian); p.load(b, side); return p }

              private fun enemy(p: Int, s: Int) = p != 0 && sideOf(p) != s
              private fun lastRank(s: Int) = if (s == 0) 7 else 0

              // ---------- генерация ----------
              fun moves(): ArrayList<Move> {
                  if (hasCapture()) {
                      val caps = ArrayList<Move>()
                      for (i in 0..31) if (sideOf(b[i]) == side && canCap(i, b[i], 0, i)) genCaps(i, caps)
                      return dedupe(caps)
                  }
                  val out = ArrayList<Move>()
                  for (i in 0..31) {
                      val p = b[i]
                      if (sideOf(p) != side) continue
                      if (isKing(p)) {
                          for (d in 0..3) {
                              var n = Geo.NB[i * 4 + d]
                              while (n >= 0 && b[n] == 0) {
                                  out.add(Move(i, n, intArrayOf(n), IntArray(0), IntArray(0), p, false))
                                  if (!russian) break
                                  n = Geo.NB[n * 4 + d]
                              }
                          }
                      } else {
                          val ds = if (side == 0) 0..1 else 2..3
                          for (d in ds) {
                              val n = Geo.NB[i * 4 + d]
                              if (n >= 0 && b[n] == 0) out.add(Move(i, n, intArrayOf(n), IntArray(0), IntArray(0), p, Geo.rank(n) == lastRank(side)))
                          }
                      }
                  }
                  return out
              }

              fun hasCapture(): Boolean {
                  for (i in 0..31) if (sideOf(b[i]) == side && canCap(i, b[i], 0, i)) return true
                  return false
              }

              private fun dedupe(l: ArrayList<Move>): ArrayList<Move> {
                  if (l.size < 2) return l
                  val seen = HashSet<Long>()
                  val o = ArrayList<Move>()
                  for (m in l) if (seen.add(m.key())) o.add(m)
                  return o
              }

              // клетки приземления после боя из pos в направлении d (пусто, если боя нет); второе значение — побитая клетка
              private fun jumps(pos: Int, piece: Int, mask: Int, start: Int, d: Int, out: IntArray): Int {
                  val s = sideOf(piece)
                  val flying = isKing(piece) && russian
                  if (!isKing(piece) && !russian) {
                      if (s == 0 && d >= 2) return -1
                      if (s == 1 && d < 2) return -1
                  }
                  var n = Geo.NB[pos * 4 + d]
                  if (flying) while (n >= 0 && (b[n] == 0 || n == start)) n = Geo.NB[n * 4 + d]
                  if (n < 0 || !enemy(b[n], s) || n == start || (mask shr n) and 1 == 1) return -1
                  var l = Geo.NB[n * 4 + d]
                  var k = 0
                  while (l >= 0 && (b[l] == 0 || l == start)) {
                      out[k++] = l
                      if (!flying) break
                      l = Geo.NB[l * 4 + d]
                  }
                  out[k] = -1
                  return if (k == 0) -1 else n
              }

              private val ctmp = IntArray(9)
              private fun canCap(pos: Int, piece: Int, mask: Int, start: Int): Boolean {
                  for (d in 0..3) if (jumps(pos, piece, mask, start, d, ctmp) >= 0) return true
                  return false
              }

              private fun genCaps(start: Int, out: ArrayList<Move>) {
                  val p = b[start]
                  rec(start, start, p, p, 0, IntArray(0), IntArray(0), out)
              }

              private fun promoted(piece: Int, sq: Int): Int {
                  if (isKing(piece)) return piece
                  val s = sideOf(piece)
                  return if (Geo.rank(sq) == lastRank(s)) piece + 1 else piece
              }

              private fun rec(start: Int, pos: Int, orig: Int, piece: Int, mask: Int, path: IntArray, caps: IntArray, out: ArrayList<Move>) {
                  val tmp = IntArray(9)
                  for (d in 0..3) {
                      val c = jumps(pos, piece, mask, start, d, tmp)
                      if (c < 0) continue
                      val ls = ArrayList<Int>()
                      var k = 0
                      while (tmp[k] >= 0) { ls.add(tmp[k]); k++ }
                      val nm = mask or (1 shl c)
                      val nc = caps + c
                      val cont = ArrayList<Int>()
                      for (l in ls) {
                          val np = promoted(piece, l)
                          val promoEnds = !russian && np != piece
                          if (!promoEnds && canCap(l, np, nm, start)) cont.add(l)
                      }
                      val use = if (cont.isNotEmpty()) cont else ls
                      for (l in use) {
                          val np = promoted(piece, l)
                          val npath = path + l
                          if (cont.isNotEmpty()) rec(start, l, orig, np, nm, npath, nc, out)
                          else out.add(Move(start, l, npath, nc, IntArray(nc.size) { b[nc[it]] }, orig, np != orig))
                      }
                  }
              }

              fun make(m: Move) {
                  b[m.from] = 0
                  hash = hash xor Z[m.from][m.piece]
                  for (k in m.capSq.indices) { b[m.capSq[k]] = 0; hash = hash xor Z[m.capSq[k]][m.capPc[k]] }
                  val np = if (m.promo) m.piece + 1 else m.piece
                  b[m.to] = np
                  hash = hash xor Z[m.to][np] xor ZS
                  side = side xor 1
              }

              fun unmake(m: Move) {
                  side = side xor 1
                  val np = if (m.promo) m.piece + 1 else m.piece
                  b[m.to] = 0
                  hash = hash xor Z[m.to][np] xor ZS
                  for (k in m.capSq.indices) { b[m.capSq[k]] = m.capPc[k]; hash = hash xor Z[m.capSq[k]][m.capPc[k]] }
                  b[m.from] = m.piece
                  hash = hash xor Z[m.from][m.piece]
              }
          }

          // ---------- движок: альфа-бета, итеративное углубление, хэш-таблица, киллеры, история ----------
          class Search {
              private val TT_BITS = 20
              private val TN = 1 shl TT_BITS
              private val tKey = LongArray(TN)
              private val tMove = LongArray(TN)
              private val tInfo = IntArray(TN)
              private val killers = LongArray(256)
              private val hist = IntArray(32 * 32)
              private val stack = LongArray(512)
              private var deadline = 0L
              private var nodes = 0L
              private var abort = false
              private val MATE = 30000

              var score = 0
              var depth = 0
              var bestLine: Move? = null
              fun nodeCount() = nodes

              fun clear() {
                  java.util.Arrays.fill(tKey, 0L); java.util.Arrays.fill(tInfo, 0)
                  java.util.Arrays.fill(hist, 0)
              }

              // оценка с точки зрения стороны, которая ходит
              private fun eval(p: Pos): Int {
                  var s = 0
                  var wm = 0; var wk = 0; var bm = 0; var bk = 0
                  val kv = if (p.russian) 280 else 160
                  for (i in 0..31) {
                      val pc = p.b[i]
                      if (pc == 0) continue
                      val r = Geo.rank(i)
                      val f = Geo.file(i)
                      val center = if (f in 2..5 && r in 2..5) 6 else 0
                      when (pc) {
                          1 -> { wm++; s += 100 + r * r + center + (if (r == 0) 6 else 0) }
                          3 -> { bm++; val rr = 7 - r; s -= 100 + rr * rr + center + (if (r == 7) 6 else 0) }
                          2 -> { wk++; s += kv + (if (isMainDiag(i)) 12 else 0) }
                          4 -> { bk++; s -= kv + (if (isMainDiag(i)) 12 else 0) }
                      }
                  }
                  // при перевесе выгодно размениваться
                  val wt = wm + wk; val bt = bm + bk
                  if (wt != bt && wt + bt > 0) s += (if (s > 0) 1 else -1) * (24 - wt - bt) * 3
                  if (wt == 0) s = -MATE / 2
                  if (bt == 0) s = MATE / 2
                  return if (p.side == 0) s else -s
              }

              private fun isMainDiag(i: Int) = Geo.file(i) == Geo.rank(i)

              private fun ttIdx(h: Long) = (h ushr (64 - TT_BITS)).toInt()

              private fun order(ms: ArrayList<Move>, ttm: Long, ply: Int) {
                  val sc = IntArray(ms.size)
                  for (k in ms.indices) {
                      val m = ms[k]
                      val key = m.key()
                      sc[k] = when {
                          key == ttm -> 1_000_000
                          m.capSq.isNotEmpty() -> 100_000 + m.capSq.size * 1000 + (if (m.promo) 500 else 0)
                          m.promo -> 90_000
                          key == killers[ply] -> 80_000
                          else -> hist[m.from * 32 + m.to]
                      }
                  }
                  // вставками: списки короткие
                  for (i in 1 until ms.size) {
                      val m = ms[i]; val v = sc[i]
                      var j = i - 1
                      while (j >= 0 && sc[j] < v) { ms[j + 1] = ms[j]; sc[j + 1] = sc[j]; j-- }
                      ms[j + 1] = m; sc[j + 1] = v
                  }
              }

              private fun ab(p: Pos, d0: Int, a0: Int, beta: Int, ply: Int): Int {
                  if ((++nodes and 2047L) == 0L && System.currentTimeMillis() > deadline) abort = true
                  if (abort) return 0
                  stack[ply] = p.hash
                  // повторение позиции на пути = ничья
                  var k = ply - 2
                  while (k >= 0) { if (stack[k] == p.hash) return 0; k -= 2 }
                  var d = d0
                  var alpha = a0
                  val ms = p.moves()
                  if (ms.isEmpty()) return -MATE + ply
                  val forcedCap = ms[0].capSq.isNotEmpty()
                  if (d <= 0 && !forcedCap) return eval(p)
                  if (d <= 0) d = 0 // бои досчитываем всегда
                  if (ms.size == 1 && ply < 120) d++ // единственный ход — продлеваем
                  if (ply >= 200) return eval(p)
                  val idx = ttIdx(p.hash)
                  var ttm = 0L
                  if (tKey[idx] == p.hash) {
                      ttm = tMove[idx]
                      val info = tInfo[idx]
                      val td = (info shr 2) and 255
                      val ts = (info shr 10) - 40000
                      val fl = info and 3
                      if (td >= d && ply > 0) {
                          if (fl == 0) return ts
                          if (fl == 1 && ts >= beta) return ts
                          if (fl == 2 && ts <= alpha) return ts
                      }
                  }
                  order(ms, ttm, ply)
                  var best = -MATE * 2
                  var bm: Move? = null
                  var first = true
                  var n = 0
                  for (m in ms) {
                      p.make(m)
                      var v: Int
                      if (first) v = -ab(p, d - 1, -beta, -alpha, ply + 1)
                      else {
                          val red = if (!forcedCap && d >= 3 && n >= 3 && !m.promo && m.key() != killers[ply]) (if (n >= 8 && d >= 5) 2 else 1) else 0
                          v = -ab(p, d - 1 - red, -alpha - 1, -alpha, ply + 1)
                          if (red > 0 && v > alpha) v = -ab(p, d - 1, -alpha - 1, -alpha, ply + 1)
                          if (v > alpha && v < beta) v = -ab(p, d - 1, -beta, -alpha, ply + 1)
                      }
                      p.unmake(m)
                      if (abort) return 0
                      first = false
                      n++
                      if (v > best) { best = v; bm = m }
                      if (v > alpha) {
                          alpha = v
                          if (ply == 0) bestLine = m
                      }
                      if (alpha >= beta) {
                          if (m.capSq.isEmpty()) { killers[ply] = m.key(); hist[m.from * 32 + m.to] += d * d }
                          break
                      }
                  }
                  val fl = if (best >= beta) 1 else if (best <= a0) 2 else 0
                  tKey[idx] = p.hash
                  tMove[idx] = bm?.key() ?: 0L
                  tInfo[idx] = ((best + 40000) shl 10) or (d.coerceIn(0, 255) shl 2) or fl
                  return best
              }

              // лучший ход за время ms (раньше, если ход единственный или найден выигрыш)
              fun best(pos: Pos, ms: Int): Move? {
                  val p = pos.copy()
                  val legal = p.moves()
                  score = 0; depth = 0; bestLine = null
                  if (legal.isEmpty()) return null
                  if (legal.size == 1) { bestLine = legal[0]; return legal[0] }
                  val t0 = System.currentTimeMillis()
                  deadline = t0 + ms
                  abort = false
                  nodes = 0
                  java.util.Arrays.fill(killers, 0L)
                  for (i in hist.indices) hist[i] = hist[i] shr 2
                  var result: Move = legal[0]
                  var d = 1
                  var stable = 0
                  while (d <= 60) {
                      bestLine = null
                      val v = ab(p, d, -MATE * 2, MATE * 2, 0)
                      if (abort) break
                      val bl = bestLine
                      if (bl != null) {
                          if (bl.key() == result.key()) stable++ else stable = 0
                          result = bl
                      }
                      score = v; depth = d
                      val el = System.currentTimeMillis() - t0
                      if (Math.abs(v) > MATE - 300) break
                      if (el > ms * 0.55) break
                      if (d >= 16 && stable >= 4 && el > ms * 0.3) break
                      d++
                  }
                  return result
              }

              fun isWin(s: Int) = Math.abs(s) > MATE - 300
              fun pliesToWin(s: Int) = MATE - Math.abs(s)
          }
