<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чек-лист: 3D модели</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mut:#6b7280;--ln:#dfe3e8;--im:#e9ecf0;--ok:#16a34a;--bad:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1b1f27;--tx:#e8ebf0;--mut:#8b94a3;--ln:#2a303b;--im:#252b35;--ok:#3ccf6e;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1b1f27;--tx:#e8ebf0;--mut:#8b94a3;--ln:#2a303b;--im:#252b35;--ok:#3ccf6e;--bad:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--ln)}
.top b{font-size:17px}.top span{color:var(--mut);font-size:14px;margin-left:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;font-size:14px;background:var(--card);border:1px solid var(--ln)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
main{padding:4px 12px 40px;max-width:720px;margin:0 auto}
h2{font-size:17px;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--mut);font-size:13px}
.add{padding:6px 12px;border-radius:8px;font-size:14px;background:var(--card);border:1px solid var(--ln)}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.g{grid-template-columns:repeat(3,1fr)}}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.c.done{border-color:var(--ok)}
.im{position:relative;aspect-ratio:4/3;background:var(--im);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.im img{width:100%;height:100%;object-fit:contain}
.ed{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--card);font-size:16px;line-height:1;padding:0}
.nm{padding:8px 10px 2px;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.c label{display:flex;align-items:center;gap:8px;padding:6px 10px 10px;color:var(--mut);font-size:14px;cursor:pointer}
.c input{width:24px;height:24px;accent-color:var(--ok);margin:0}
.rst{margin-top:26px;background:none;border:1px solid var(--ln);color:var(--mut);border-radius:8px;padding:10px 14px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.md{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;width:min(100%,420px);display:flex;flex-direction:column;gap:12px}
.md b{font-size:17px}
.md input[type=text]{font:inherit;font-size:16px;padding:11px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);width:100%}
.mp{aspect-ratio:4/3;background:var(--im);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;overflow:hidden}
.mp img{width:100%;height:100%;object-fit:contain}
.mr{display:flex;gap:8px}.mr>*{flex:1}
.sec,.fb{padding:11px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);text-align:center;font-size:15px;cursor:pointer}
.pri{padding:11px 10px;border-radius:8px;border:0;background:var(--ok);color:#fff;font-weight:600;font-size:15px}
.del{padding:9px;border-radius:8px;border:1px solid var(--bad);background:none;color:var(--bad);font-size:15px}
</style>
</head>
<body>
<div class="top"><b>Чек-лист 3D моделей</b><span>Есть 3D: <b id="t3">0</b> из <b id="tn">0</b></span>
<div class="chips" id="cats"></div><div class="chips" id="sts"></div></div>
<main id="app"></main>
<div class="ov" id="ov"><div class="md">
<b id="mt"></b>
<input id="mn" type="text" placeholder="Название" maxlength="60">
<div class="mp" id="mp"></div>
<div class="mr"><label class="fb">Выбрать картинку<input id="mf" type="file" accept="image/*" hidden></label><button class="sec" id="mx">Убрать картинку</button></div>
<div class="mr"><button class="sec" id="mc">Отмена</button><button class="pri" id="ms">Сохранить</button></div>
<button class="del" id="md">Удалить</button>
</div></div>

const K="px_checklist_v1",KC="px_checklist_custom_v1";

const $=id=>document.getElementById(id);
function list(si){
  const a=D[si][1].filter(it=>!cu.del[it[2]]).map(it=>{const o=cu.ov[it[2]]||{};return{id:it[2],name:o.n!==undefined?o.n:it[0],img:o.i!==undefined?o.i:it[1],base:1}});

}
let fc=-1,fs=0;

function applyF(){

    const x=c.querySelector("input").checked,s=+c.dataset.s;

    c.style.display=ok?"":"none";if(ok)vis[s]=1;
  });
  document.querySelectorAll("h2,.g").forEach(e=>{const s=+e.dataset.s;e.style.display=((fc<0||fc===s)&&(fs===0||vis[s]||fc===s))?"":"none"});

const app=$("app");

  });
  const rb=document.createElement("button");rb.className="rst";rb.textContent="Сбросить все галочки";
  rb.onclick=()=>{if(confirm("Сбросить все галочки?")){st={};save();document.querySelectorAll(".c input").forEach(i=>i.checked=false);upd()}};
  app.append(rb);
  upd();
}
function upd(){
  let m=0,n=0;const sc={};
  document.querySelectorAll(".c").forEach(c=>{
    const x=c.querySelector("input").checked;n++;if(x)m++;c.classList.toggle("done",x);
    const a=sc[c.dataset.s]=sc[c.dataset.s]||[0,0];a[0]++;if(x)a[1]++;
  });
  D.forEach((s,i)=>{const a=sc[i]||[0,0];$("c"+i).textContent=a[1]+"/"+a[0]});
  $("t3").textContent=m;$("tn").textContent=n;applyF();
}
let ec=null,ei="";
function openEd(si,it){
  ec={si,it};ei=it?it.img:"";
  $("mt").textContent=it?"Изменить":"Добавить: "+D[si][0];
  $("mn").value=it?it.name:"";
  showPrev();$("md").style.display=it?"":"none";$("ov").style.display="flex";
  if(!it)setTimeout(()=>$("mn").focus(),50);
}
function showPrev(){const p=$("mp");p.innerHTML="";if(ei){const i=document.createElement("img");i.src=ei;p.append(i)}else p.textContent="нет картинки";$("mx").style.display=ei?"":"none"}
function closeEd(){$("ov").style.display="none";ec=null}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);let u=cv.toDataURL("image/webp",.72);if(u.indexOf("data:image/webp")!==0)u=cv.toDataURL("image/png");ok(u)};im.src=r.result};r.readAsDataURL(f)})}
$("mf").onchange=e=>{const f=e.target.files[0];if(!f)return;shrink(f).then(u=>{ei=u;showPrev()}).catch(()=>alert("Не удалось открыть картинку"));e.target.value=""};
$("mx").onclick=()=>{ei="";showPrev()};
$("mc").onclick=closeEd;
$("ov").onclick=e=>{if(e.target===$("ov"))closeEd()};
$("ms").onclick=()=>{
  const n=$("mn").value.trim();if(!n){$("mn").focus();return}
  const {si,it}=ec;
  if(!it){(cu.add[si]=cu.add[si]||[]).push({id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:n,i:ei})}
  else if(it.base){cu.ov[it.id]={n:n,i:ei}}
  else{const o=(cu.add[si]||[]).find(x=>x.id===it.id);if(o){o.n=n;o.i=ei}}
  if(saveCu()){closeEd();render()}
};
$("md").onclick=()=>{
  const {si,it}=ec;if(!it||!confirm("Удалить «"+it.name+"»?"))return;
  if(it.base)cu.del[it.id]=1;else cu.add[si]=(cu.add[si]||[]).filter(x=>x.id!==it.id);
  delete st[it.id];save();saveCu();closeEd();render();
};
render();
</script>
</body>
</html>
